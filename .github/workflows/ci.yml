name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (tests + comprobaciones de despliegue)
    runs-on: ubuntu-latest
    env:
      # Clave exclusiva de CI. Debe superar security.W009 del check --deploy:
      # 50+ caracteres, 5+ caracteres distintos y sin prefijo django-insecure-.
      SECRET_KEY: ci-only-9f3h2k8s7d6f5g4h3j2k1l0p9o8i7u6y5t4r3e2w1q0z9x8c7v6b5n4m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Tests
        working-directory: backend
        env:
          # Sin DATABASE_URL, development usa SQLite: no hace falta servidor.
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py test

      - name: Comprobaciones de despliegue (producción)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DATABASE_URL: postgres://user:password@localhost:5432/db
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (build de la SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # Verifica que los artefactos commiteados en backend/static/web se
      # pueden regenerar: si esto falla, la web pública del despliegue también.
      - name: Build
        working-directory: frontend
        run: npm run build
