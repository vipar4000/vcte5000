name: Respaldo Diario de PostgreSQL

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
    - name: Instalar PostgreSQL 18 (cliente)
      run: |
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
        sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
        sudo apt-get update
        sudo apt-get install -y postgresql-client-18

    - name: Diagnóstico de conexión
      shell: bash
      run: |
        echo "=== Versión de pg_dump (v18) ==="
        /usr/lib/postgresql/18/bin/pg_dump --version
        echo ""
        echo "=== Test de conexión psql ==="
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT version();" 2>&1 || echo "PSQL_FALLO (error real arriba)"

    - name: Realizar copia de seguridad (pg_dump)
      run: |
        /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" -F c -b -v -f backup_django_$(date +%Y%m%d).sql

    - name: Subir respaldo a almacenamiento seguro
      uses: actions/upload-artifact@v4
      with:
        name: respaldo-postgres-${{ github.run_id }}
        path: backup_django_*.sql
        retention-days: 30
