services:
  db:
    image: postgres:15-alpine
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: eurocar_prod
      POSTGRES_USER: eurocar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurocar"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    env_file: .env.production
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - vue_data:/app/static/web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    command: celery -A config worker -l warning
    env_file: .env.production
    volumes:
      - media_data:/app/media
    depends_on:
      - backend
      - redis
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - static_data:/app/staticfiles:ro
      - vue_data:/app/static/web:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  media_data:
  static_data:
  vue_data:
