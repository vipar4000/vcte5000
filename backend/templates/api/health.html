<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Health - R Car Rogil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'eurocar-blue': '#1B3A5C',
                        'eurocar-light': '#5DADE2',
                        'eurocar-green': '#2ECC71',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
        <div class="text-center">
            <div class="mb-4">
                <span class="text-6xl">✅</span>
            </div>
            <h1 class="text-2xl font-bold text-eurocar-blue mb-2">R Car Rogil ERP</h1>
            <p class="text-gray-500 mb-6">API Status</p>
            
            <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                <div class="flex items-center justify-center">
                    <span class="text-green-500 text-xl mr-2">●</span>
                    <span class="text-green-700 font-semibold">Estado: OK</span>
                </div>
            </div>
            
            <div class="text-left bg-gray-50 rounded-lg p-4">
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <span class="text-gray-500">Servicio:</span>
                    <span class="font-medium">{{ service }}</span>
                    
                    <span class="text-gray-500">Consulta:</span>
                    <span class="font-medium">{{ fecha }}</span>
                </div>
            </div>
        </div>
        
        <div class="mt-6 text-center">
            <a href="/api/vehiculos/" class="text-eurocar-light hover:underline text-sm mr-4">Vehículos</a>
            <a href="/api/marcas/" class="text-eurocar-light hover:underline text-sm">Marcas</a>
        </div>
    </div>
</body>
</html>
