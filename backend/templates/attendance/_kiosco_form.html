<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-eurocar-blue to-blue-900">
    <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-eurocar-blue">R Car Rogil</h1>
            <p class="text-gray-500">Kiosco de Asistencia</p>
        </div>

        {% if mensaje %}
        <div class="mb-6 p-4 rounded-lg {% if tipo_mensaje == 'success' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
            <p class="font-medium text-center">{{ mensaje }}</p>
        </div>
        {% endif %}

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label for="pin" class="block text-sm font-medium text-gray-700 mb-2 text-center">
                    Ingrese su PIN de 4 dígitos
                </label>
                {{ form.pin }}
                {% if form.pin.errors %}
                <p class="text-red-500 text-sm mt-1 text-center">{{ form.pin.errors.0 }}</p>
                {% endif %}
            </div>
            <button type="submit"
                    class="w-full bg-eurocar-blue text-white py-3 rounded-lg hover:bg-blue-800 transition font-medium">
                Fichar
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-6">
            Fiche su entrada o salida con el PIN de su ficha.
        </p>
    </div>
</div>
