services:
  - type: web
    name: eurocar-staging
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    branch: staging
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    healthCheckPath: /api/ping/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.staging
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
