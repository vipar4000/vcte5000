services:
  - type: web
    name: eurocar
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    branch: master
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    healthCheckPath: /api/ping/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eurocar-db
          property: connectionString
      # --- Media storage en R2 (opcional pero recomendado para no perder PDFs en redeploy) ---
      # Descomenta / define AWS_STORAGE_BUCKET_NAME para activar R2.
      # Si se deja vacío, los medios usan el filesystem efímero de Render.
      - key: AWS_STORAGE_BUCKET_NAME
        value: eurocar
      - key: AWS_S3_ACCESS_KEY_ID
        sync: false
      - key: AWS_S3_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        value: https://987c5b0d48c2071fcb9c5533c7153a7d.r2.cloudflarestorage.com
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: AWS_QUERYSTRING_AUTH
        value: "False"

databases:
  - name: eurocar-db
    databaseName: eurocar
    user: eurocar
    plan: free
    region: oregon
