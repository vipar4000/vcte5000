# Servidores del ERP en Render — región Fráncfort (UE), la más cercana a Madrid.
#
# Sobre los planes: los servicios gratuitos se suspenden por inactividad y las
# bases gratuitas caducan (~30 días). Para un negocio en marcha, plan de pago.
#
# Sobre los secretos (sync: false): se rellenan en el dashboard de Render y no
# viven en el repositorio.
#
# Ojo: la REGIÓN de un servicio ya creado no se puede cambiar. Para pasar de
# Oregón a Fráncfort hay que crear el servicio nuevo y borrar el viejo.

services:
  # ---------------------------------------------------------------- STAGING
  # Gratuito a propósito: es un entorno de pruebas puntuales. Se suspende por
  # inactividad y su base gratuita caduca (~30 días): si se necesita, se vuelve
  # a sembrar con create_test_users.py y los datos de ejemplo.
  - type: web
    name: eurocar-staging
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    branch: staging
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    healthCheckPath: /api/ping/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.staging
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,staging.rogil.co
      - key: CSRF_TRUSTED_ORIGINS
        value: https://staging.rogil.co
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  # ------------------------------------------------------------- PRODUCCION
  - type: web
    name: eurocar
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    branch: master
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    healthCheckPath: /api/ping/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: rogil.co,www.rogil.co,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://rogil.co,https://www.rogil.co
      # Dominio temporal: no meter en la lista de preload de los navegadores.
      - key: HSTS_PRELOAD
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # AWS_* (R2 para fotos y facturas) se añaden en el dashboard cuando
      # exista el bucket; sin ellas, la media se guarda en disco y se pierde
      # en cada despliegue.
