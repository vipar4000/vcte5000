services:
  - type: web
    name: eurocar
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    branch: master
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: eurocar-db
          property: connectionString
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

databases:
  - name: eurocar-db
    databaseName: eurocar
    user: eurocar
    plan: free
    region: oregon
